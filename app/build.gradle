plugins {
    id 'com.android.application'
}

// Value from local.properties (not in the repository), empty if missing
def localProperty(String key) {
    def props = new Properties()
    def file = rootProject.file('local.properties')
    if (file.exists()) {
        file.withInputStream { props.load(it) }
    }
    return props.getProperty(key, '')
}

android {
    namespace 'com.rch.mdm.sample'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mooney.mdm.sample'
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName '1.2'

        // MDM launcher library API key (LIBRARY_API_KEY of the launcher build), needed by
        // HeadwindMDM.sendPush(). Kept out of the repository: set hmdm.apiKey in local.properties.
        buildConfigField 'String', 'HMDM_API_KEY', "\"${localProperty('hmdm.apiKey')}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation project(':mdmlib')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation files('libs/hmdm-1.2.0.aar')
}
