plugins {
    id 'com.android.application'
}

// Value from local.properties (not in the repository), empty if missing
def localProperty(String key) {
    def props = new Properties()
    def file = rootProject.file('local.properties')
    if (file.exists()) {
        file.withInputStream { props.load(it) }
    }
    return props.getProperty(key, '')
}

android {
    namespace 'com.rch.mdm.sample'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mooney.mdm.sample'
        minSdk 21
        targetSdk 34
        versionCode 18
        versionName '1.17'

        // MDM launcher library API key (LIBRARY_API_KEY of the launcher build), needed by
        // HeadwindMDM.sendPush(). Kept out of the repository: set hmdm.apiKey in local.properties.
        buildConfigField 'String', 'HMDM_API_KEY', "\"${localProperty('hmdm.apiKey')}\""
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // The Ingenico USDK (WiFi configuration) accepts only apps signed with an Ingenico-approved
    // key: sign with the launcher's key when its properties are set in ~/.gradle/gradle.properties
    // (RELEASE_M10_*), otherwise with the debug key (then the WiFi configuration fails)
    def ingenicoKey = project.hasProperty('RELEASE_M10_STORE_FILE')
    signingConfigs {
        if (ingenicoKey) {
            ingenico {
                storeFile file(RELEASE_M10_STORE_FILE)
                keyAlias RELEASE_M10_KEY_ALIAS
                storePassword RELEASE_M10_STORE_PASSWORD
                keyPassword RELEASE_M10_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            if (ingenicoKey) signingConfig signingConfigs.ingenico
        }
        release {
            minifyEnabled false
            if (ingenicoKey) signingConfig signingConfigs.ingenico
        }
    }

    // APK name: sample_hmdm_app-<versionName>-<buildType>.apk
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "sample_hmdm_app-${variant.versionName}-${variant.buildType.name}.apk"
        }
    }
}

def usdkJar = file('libs/usdk_api_aidl_v13.12.0.20240202.jar')

dependencies {
    implementation project(':mdmlib')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation files('libs/hmdm-1.2.2.aar')
    // Ingenico USDK (WiFi configuration): proprietary, not in the repository, see the README
    implementation files(usdkJar)
}

// Clear message instead of compile errors when the USDK jar is missing (checked only when the app
// is built, so the mdmlib build doesn't need it)
tasks.named('preBuild') {
    doFirst {
        if (!usdkJar.exists()) {
            throw new GradleException("Missing ${usdkJar}: copy usdk_api_aidl_v13.12.0.20240202.jar " +
                    "from app/libs/ of the launcher repo (or the Ingenico USDK) to app/libs/, see the README")
        }
    }
}
